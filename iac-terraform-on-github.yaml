# terraform-on-github — per-repo config. Schema: The-Gopher/terraform-on-github docs/CONFIG.md
#
# Read from the app's trusted ref, never from a PR head and never from a PR's base branch.
# Editing this file in a PR does not change how that PR is planned.
#
# That property is load-bearing here rather than theoretical. The flow is
# feature -> non-prod -> main: `non-prod` is open by design, so anyone with merge rights there
# could otherwise add a workspace naming a production apply identity and have the next PR into
# `non-prod` apply with it. This file naming `tf-ei-production-apply@production-227420` is safe
# only while `non-prod` cannot edit it.
#
# Three things about this repo shape the rest of the file:
#
#   1. Two long-lived branches. Non-prod lands on `non-prod` and is promoted to `main`, so a
#      workspace binds to the branch its changes land on, and the promotion PR is what plans
#      production.
#   2. Environments are Terraform *workspaces* on one GCS prefix per subdir, not a directory
#      per environment. `env_instance` alone is nine environments in one root module. That is
#      the compatibility case DESIGN §13.1 asks callers to confirm, and it is why thirteen of
#      the entries below carry `terraform_workspace` and share a `dir` with their siblings.
#   3. Four roots have no non-prod half — `infra`, `metrics`, `vanta` and `github_wif` are one
#      workspace each, against production or the organization. Each is declared twice: plan-only
#      on `non-prod` so a change still gets a plan before it lands, and appliable from `main`.
#
# The roots that are absent are absent because this app cannot authenticate them, not because
# they are unmanaged: `auth0/`, `auth0_eurofins/` and `auth0_prod/` each authenticate as an
# Auth0 client whose secret comes from a gitignored `secrets.auto.tfvars`, and `github/` needs a
# GitHub token carrying `admin:org`. Neither is a GCP identity, so neither is expressible as
# `impersonate`. Those four keep planning by hand until this config grows a secret reference.

version: 1

defaults:
  # Matches the version CI pins for `fmt -check` and `validate`. `drinking_water` overrides it.
  terraform_version: "1.9.8"
  plan_timeout: 20m
  apply_timeout: 45m
  summary_detail: addresses

workspaces:
  - name: env-instance-dev
    branch: non-prod
    dir: env_instance
    terraform_workspace: dev
    backend: { bucket: sampleserve-terraform-state, prefix: env_instance }
    impersonate:
      plan: tf-ei-dev-plan@stage-227420.iam.gserviceaccount.com
      apply: tf-ei-dev-apply@stage-227420.iam.gserviceaccount.com
    apply:

  - name: env-instance-qa
